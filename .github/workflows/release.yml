name: Publish tool collection

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tools.json'
      - 'README.md'
      - 'scripts/publish_release.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tools and publish matching release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_release.py
